[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tapout"
version = "0.1.0"
description = "TAP-Out: Tracking Any Point in 360° via Outpainting"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.13"
authors = [
    { name = "Finlay G. C. Hudson" },
    { name = "James A. D. Gardner" },
    { name = "William A. P. Smith" },
]
keywords = ["point-tracking", "360-video", "computer-vision"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# NOTE ON TORCH: `torch` and `torchvision` are intentionally NOT listed here.
# CUDA vs CPU vs ROCm wheels live at different indexes, so we install them
# separately in `scripts/setup_env.sh` (step 1) with the right ``--index-url``.
# Every dep below is happy to reuse whatever torch is already in the env.
dependencies = [
    "accelerate==1.10.1",
    "decord==0.6.0",
    "diffusers==0.35.1",
    "einops==0.8.1",
    "gdown>=5",
    "hf-transfer>=0.1",
    "huggingface-hub==0.35.3",
    "imageio==2.37.0",
    "natsort==8.4.0",
    "numpy==2.2.6",
    "opencv-python==4.12.0.88",
    "pillow==11.3.0",
    "pyequilib==0.5.8",
    "pyyaml==6.0.3",
    "roma",
    "safetensors==0.6.2",
    "scikit-image",
    "scikit-learn==1.7.2",
    "scikit-video==1.1.11",
    "scipy==1.15.3",
    "timm==1.0.20",
    "tqdm==4.67.1",
    "transformers==4.57.1",
    # Third-party model repos, pinned to the commits used in the paper.
    # Names on the LHS of `@` must match each repo's own package-name metadata.
    # NOTE: VGGT is intentionally NOT here — its pyproject pins numpy<2 which
    # conflicts with modern opencv-python etc. `scripts/setup_env.sh` installs
    # it with `--no-deps` after the main resolve completes. It works fine on
    # numpy 2 at runtime; the upstream pin is defensive.
    "SAM-2 @ git+https://github.com/facebookresearch/sam2.git@2b90b9f",
    # CoTracker3 weights are loaded via torch.hub at the same commit (runners/cotracker_utils.py).
    "cotracker @ git+https://github.com/facebookresearch/co-tracker.git@82e02e8029753ad4ef13cf06be7f4fc5facdda4d",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.urls]
"Paper"   = "https://arxiv.org/abs/2611.00406"
"Code"    = "https://github.com/finlay-hudson/TAP-Out"
"Dataset" = "https://huggingface.co/datasets/fhudson96/TAPVid360-10k"

[tool.setuptools.packages.find]
include = [
    "conversions*",
    "data*",
    "metrics*",
    "runners*",
    "pipelines*",
    "third_party*",
]
exclude = ["scripts*", "configs*", "assets*", "docs*"]
